<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scout — Work With Us Hero (Direction A)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --paper:#f3efe6;
    --ink:#2f3a44;
    --muted:#8a9097;
    --line:rgba(47,58,68,.26);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{ font-family:"Jost",sans-serif; background:var(--paper); -webkit-font-smoothing:antialiased; }

  /* ===== Shell ===== */
  .ww{ width:100%; background:var(--paper); padding:30px; }
  .ww-frame{ border:1px solid var(--line); padding:54px 60px; }

  /* Eyebrow row */
  .ww-eyebrow{ display:flex; justify-content:space-between; align-items:baseline;
    font-size:13px; font-weight:400; letter-spacing:.28em; color:var(--muted); }

  /* Body */
  .ww-body{ display:grid; grid-template-columns:1fr 1.05fr; gap:56px; align-items:center; margin-top:30px; }
  .ww-col{ display:flex; flex-direction:column; gap:30px; }

  .ww-h{ font-family:"Playfair Display",serif; font-weight:500; color:var(--ink); margin:0;
    font-size:clamp(40px,5.2vw,72px); line-height:1.02; letter-spacing:.005em; }
  .ww-h em{ font-style:italic; font-weight:400; }

  .ww-rule{ width:80px; height:1px; background:var(--line); }
  .ww-sub{ color:var(--muted); font-size:14px; font-weight:400; letter-spacing:.2em; line-height:1.85;
    margin:0; max-width:34ch; text-transform:uppercase; }

  .ww-btn{ display:inline-flex; align-items:center; gap:14px; align-self:flex-start;
    border:1px solid var(--ink); color:var(--ink); cursor:pointer; text-decoration:none;
    font-size:13px; font-weight:500; letter-spacing:.22em; padding:17px 30px; background:none;
    text-transform:uppercase; transition:background .28s ease, color .28s ease; }
  .ww-btn span{ transition:transform .28s ease; }
  .ww-btn:hover{ background:var(--ink); color:var(--paper); }
  .ww-btn:hover span{ transform:translateX(5px); }

  /* Stepped gallery */
  .ww-gallery{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; align-items:center; }
  .ww-photo{ margin:0; overflow:hidden; background:#20262c; aspect-ratio:4/5; }
  .ww-photo img{ width:100%; height:100%; object-fit:cover; display:block; }
  .ww-photo.g1{ transform:translateY(26px); }
  .ww-photo.g2{ transform:translateY(-14px); }
  .ww-photo.g3{ transform:translateY(34px); }

  /* ===== Responsive ===== */
  @media (max-width:760px){
    .ww{ padding:16px; }
    .ww-frame{ padding:30px 24px; }
    .ww-body{ grid-template-columns:1fr; gap:38px; }
    .ww-photo.g1,.ww-photo.g2,.ww-photo.g3{ transform:none; }
  }
  @media (max-width:440px){
    .ww-gallery{ gap:10px; }
  }
</style>
</head>
<body>
  <section class="ww">
    <div class="ww-frame">
      <div class="ww-eyebrow">
        <span>WORK WITH US</span>
        <span>BEHAVIORAL HEALTH</span>
      </div>
      <div class="ww-body">
        <div class="ww-col">
          <h1 class="ww-h">Real people,<br /><em>real partnership.</em></h1>
          <div class="ww-rule"></div>
          <p class="ww-sub">A small studio that builds, writes, and ships digital work for behavioral health practices.</p>
          <a class="ww-btn" href="#contact">Start a project <span>&#8594;</span></a>
        </div>
        <div class="ww-gallery">
          <!-- order: locs/glasses · woman · linen shirt -->
          <figure class="ww-photo g1"><img src="assets/team-2.jpg" alt="Scout team member" /></figure>
          <figure class="ww-photo g2"><img src="assets/team-1.jpg" alt="Scout team member" /></figure>
          <figure class="ww-photo g3"><img src="assets/team-3.jpg" alt="Scout team member" /></figure>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
